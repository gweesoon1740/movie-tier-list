<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>영화 티어리스트</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: 'Segoe UI', sans-serif; background: #0a0a0f; color: #fff; min-height: 100vh; }

  /* 시작 페이지 */
  #startPage {
    display: flex; flex-direction: column; align-items: center;
    justify-content: center; min-height: 100vh;
    background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 50%, #16213e 100%);
  }
  .start-logo {
    font-size: 3rem; font-weight: 900;
    background: linear-gradient(90deg, #e50914, #ff6b35, #ffd700);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    margin-bottom: 0.5rem; letter-spacing: 2px;
  }
  .start-sub { color: #aaa; font-size: 1rem; margin-bottom: 3rem; }
  .start-card {
    background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1);
    border-radius: 20px; padding: 2.5rem; width: 360px; backdrop-filter: blur(10px);
  }
  .start-card h2 { font-size: 1.3rem; margin-bottom: 1.5rem; text-align: center; }
  .start-card input {
    width: 100%; padding: 0.9rem 1.2rem; border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2); background: rgba(255,255,255,0.08);
    color: #fff; font-size: 1rem; margin-bottom: 1rem; outline: none; transition: border 0.3s;
  }
  .start-card input:focus { border-color: #e50914; }
  .start-card input::placeholder { color: #666; }
  .btn-start {
    width: 100%; padding: 0.9rem; border-radius: 12px; border: none;
    background: linear-gradient(90deg, #e50914, #ff6b35);
    color: #fff; font-size: 1.1rem; font-weight: 700; cursor: pointer; transition: opacity 0.3s, transform 0.2s;
  }
  .btn-start:hover { opacity: 0.85; transform: translateY(-2px); }

  /* 메인 페이지 */
  #mainPage { display: none; min-height: 100vh; }
  .header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem 2rem; background: rgba(10,10,15,0.95);
    border-bottom: 1px solid rgba(255,255,255,0.08);
    position: sticky; top: 0; z-index: 100; backdrop-filter: blur(10px);
  }
  .header-logo {
    font-size: 1.5rem; font-weight: 900;
    background: linear-gradient(90deg, #e50914, #ffd700);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
  }
  .user-badge {
    background: linear-gradient(90deg, #e50914, #ff6b35);
    padding: 0.4rem 1rem; border-radius: 20px; font-size: 0.9rem; font-weight: 600;
  }
  .header-btns { display: flex; gap: 0.5rem; align-items: center; }
  .btn-icon {
    background: rgba(255,255,255,0.08); border: 1px solid rgba(255,255,255,0.15);
    color: #fff; padding: 0.5rem 1rem; border-radius: 10px;
    cursor: pointer; font-size: 0.85rem; transition: background 0.2s; white-space: nowrap;
  }
  .btn-icon:hover { background: rgba(255,255,255,0.15); }

  /* 메인 컨텐츠 */
  .main-content { padding: 2rem; max-width: 1200px; margin: 0 auto; }
  .section-title { font-size: 1.1rem; font-weight: 700; margin-bottom: 1.2rem; color: #ccc; }

  /* 티어 행 */
  .tier-container { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 2rem; }
  .tier-row {
    display: flex; align-items: stretch;
    background: rgba(255,255,255,0.03); border: 2px solid rgba(255,255,255,0.08);
    border-radius: 16px; overflow: hidden; min-height: 120px; transition: border-color 0.2s, opacity 0.2s;
  }
  .tier-row.drag-over-row { border-color: #ffd700; background: rgba(255,215,0,0.05); }
  .tier-row.row-dragging { opacity: 0.35; }
  .tier-label {
    width: 90px; min-width: 90px; display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    font-weight: 900; font-size: 1.4rem; cursor: grab;
    user-select: none; gap: 0.3rem; padding: 0.5rem;
  }
  .tier-label .tier-stars { font-size: 0.75rem; letter-spacing: 1px; }
  .tier-s .tier-label { background: linear-gradient(135deg, #ffd700, #ffaa00); color: #000; }
  .tier-a .tier-label { background: linear-gradient(135deg, #e50914, #c00); color: #fff; }
  .tier-b .tier-label { background: linear-gradient(135deg, #4a90d9, #2563eb); color: #fff; }
  .tier-movies {
    flex: 1; display: flex; flex-wrap: wrap; gap: 0.8rem;
    padding: 1rem; align-items: flex-start; align-content: flex-start; min-height: 100px;
  }
  .tier-movies.drag-over-movies { background: rgba(229,9,20,0.07); }

  /* 영화 카드 */
  .movie-card {
    width: 80px; cursor: grab; border-radius: 10px; overflow: hidden;
    border: 2px solid transparent; transition: transform 0.2s, border-color 0.2s;
    position: relative; background: #1a1a2e; user-select: none; flex-shrink: 0;
  }
  .movie-card:hover { transform: scale(1.08); border-color: rgba(255,255,255,0.3); }
  .movie-card.dragging { opacity: 0.3; }
  .movie-card img { width: 100%; height: 110px; object-fit: cover; display: block; background: #222; }
  .movie-card .movie-title {
    font-size: 0.62rem; text-align: center; padding: 0.3rem 0.2rem;
    line-height: 1.3; color: #ddd; background: rgba(0,0,0,0.7);
  }
  .movie-card .delete-btn {
    position: absolute; top: 3px; right: 3px;
    background: rgba(229,9,20,0.9); border: none; color: #fff;
    width: 20px; height: 20px; border-radius: 50%;
    font-size: 0.7rem; cursor: pointer; display: none;
    align-items: center; justify-content: center;
  }
  .movie-card:hover .delete-btn { display: flex; }

  /* 미배치 영역 */
  .unplaced-section {
    background: rgba(255,255,255,0.02); border: 2px dashed rgba(255,255,255,0.12);
    border-radius: 16px; padding: 1.5rem; margin-bottom: 2rem; transition: border-color 0.2s;
  }
  .unplaced-section.drag-over-movies { border-color: #e50914; background: rgba(229,9,20,0.05); }
  .unplaced-movies { display: flex; flex-wrap: wrap; gap: 0.8rem; min-height: 60px; align-items: flex-start; }
  .add-movie-btn {
    width: 80px; height: 140px; border: 2px dashed rgba(255,255,255,0.2);
    border-radius: 10px; background: transparent; color: #555;
    font-size: 2rem; cursor: pointer; display: flex;
    align-items: center; justify-content: center; transition: border-color 0.2s, color 0.2s; flex-shrink: 0;
  }
  .add-movie-btn:hover { border-color: #e50914; color: #e50914; }

  /* 모달 */
  .modal-overlay {
    display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.75);
    z-index: 1000; align-items: center; justify-content: center; backdrop-filter: blur(4px);
  }
  .modal-overlay.active { display: flex; }
  .modal {
    background: #1a1a2e; border: 1px solid rgba(255,255,255,0.15);
    border-radius: 20px; padding: 2rem; width: 420px; max-width: 92vw;
    max-height: 90vh; overflow-y: auto;
  }
  .modal h3 { font-size: 1.2rem; margin-bottom: 1.5rem; }
  .modal-label { font-size: 0.85rem; color: #aaa; margin-bottom: 0.4rem; display: block; }
  .modal input, .modal textarea {
    width: 100%; padding: 0.8rem 1rem; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.15); background: rgba(255,255,255,0.06);
    color: #fff; font-size: 0.95rem; margin-bottom: 1rem;
    outline: none; resize: none; font-family: inherit;
  }
  .modal input:focus, .modal textarea:focus { border-color: #e50914; }
  .modal input::placeholder, .modal textarea::placeholder { color: #555; }
  .modal-btns { display: flex; gap: 0.8rem; margin-top: 0.5rem; }
  .btn-confirm {
    flex: 1; padding: 0.8rem; border-radius: 10px; border: none;
    background: linear-gradient(90deg, #e50914, #ff6b35);
    color: #fff; font-weight: 700; cursor: pointer; font-size: 0.95rem; transition: opacity 0.2s;
  }
  .btn-confirm:hover { opacity: 0.85; }
  .btn-cancel {
    flex: 1; padding: 0.8rem; border-radius: 10px;
    border: 1px solid rgba(255,255,255,0.2); background: transparent;
    color: #aaa; cursor: pointer; font-size: 0.95rem; transition: background 0.2s;
  }
  .btn-cancel:hover { background: rgba(255,255,255,0.05); }

  /* 토스트 알림 */
  .toast {
    position: fixed; bottom: 2rem; right: 2rem;
    background: #1a1a2e; border: 1px solid rgba(255,255,255,0.15);
    border-left: 4px solid #e50914; border-radius: 14px;
    padding: 1rem 1.5rem; z-index: 3000;
    transform: translateX(120%); opacity: 0;
    transition: transform 0.4s cubic-bezier(0.34,1.56,0.64,1), opacity 0.4s;
    max-width: 300px; box-shadow: 0 8px 32px rgba(0,0,0,0.5);
  }
  .toast.show { transform: translateX(0); opacity: 1; }
  .toast-title { font-weight: 700; margin-bottom: 0.3rem; font-size: 0.95rem; }
  .toast-msg { color: #aaa; font-size: 0.85rem; }

  /* 친구 목록 */
  .friends-list {
    display: flex; flex-direction: column; gap: 0.7rem;
    margin-bottom: 1.5rem; max-height: 280px; overflow-y: auto;
  }
  .friend-item {
    display: flex; align-items: center; justify-content: space-between;
    background: rgba(255,255,255,0.05); border-radius: 12px;
    padding: 0.9rem 1rem; cursor: pointer; transition: background 0.2s;
    border: 1px solid rgba(255,255,255,0.08);
  }
  .friend-item:hover { background: rgba(255,255,255,0.1); }
  .friend-name { font-weight: 600; font-size: 0.95rem; }
  .friend-meta { font-size: 0.78rem; color: #666; margin-top: 0.2rem; }
  .friend-arrow { color: #555; font-size: 1.1rem; }

  /* 공유 링크 박스 */
  .share-link-box { display: flex; gap: 0.5rem; margin-bottom: 1rem; }
  .share-link-box input { flex: 1; margin-bottom: 0; font-size: 0.8rem; color: #aaa; }
  .btn-copy {
    padding: 0.8rem 1rem; border-radius: 10px; border: none;
    background: #e50914; color: #fff; cursor: pointer; font-size: 0.85rem; white-space: nowrap;
  }
  .btn-copy:hover { opacity: 0.85; }

  /* 빈 상태 */
  .empty-hint { color: #444; font-size: 0.85rem; padding: 0.5rem; }

  /* 스크롤바 */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.15); border-radius: 3px; }
</style>
</head>
<body>

<div id="startPage">
  <div class="start-logo">🎬 TIER LIST</div>
  <div class="start-sub">나만의 영화 티어리스트를 만들어보세요</div>
  <div class="start-card">
    <h2>👤 이름을 입력하세요</h2>
    <input type="text" id="nameInput" placeholder="예) 홍길동" maxlength="10" />
    <button class="btn-start" onclick="startApp()">시작하기 🚀</button>
  </div>
</div>

<!-- ===== 메인 페이지 ===== -->
<div id="mainPage">

  <!-- 헤더 -->
  <div class="header">
    <div class="header-logo">🎬 TIER LIST</div>
    <div class="header-btns">
      <span class="user-badge" id="userBadge"></span>
      <button class="btn-icon" onclick="openShareModal()">🔗 공유</button>
      <button class="btn-icon" onclick="openFriendsModal()">👥 친구 목록</button>
    </div>
  </div>

  <!-- 메인 컨텐츠 -->
  <div class="main-content">

    <!-- 티어 행 -->
    <div class="section-title">⭐ 나의 티어리스트</div>
    <div class="tier-container" id="tierContainer">

      <!-- S 티어 -->
      <div class="tier-row tier-s" data-tier="S"
           draggable="true"
           ondragstart="rowDragStart(event, 'S')"
           ondragover="rowDragOver(event)"
           ondragend="rowDragEnd(event)"
           ondrop="rowDrop(event, 'S')">
        <div class="tier-label">
          <span>S</span>
          <span class="tier-stars">★★★</span>
        </div>
        <div class="tier-movies" id="tier-S"
             ondragover="movieDragOver(event)"
             ondragleave="movieDragLeave(event)"
             ondrop="movieDrop(event, 'S')">
        </div>
      </div>

      <!-- A 티어 -->
      <div class="tier-row tier-a" data-tier="A"
           draggable="true"
           ondragstart="rowDragStart(event, 'A')"
           ondragover="rowDragOver(event)"
           ondragend="rowDragEnd(event)"
           ondrop="rowDrop(event, 'A')">
        <div class="tier-label">
          <span>A</span>
          <span class="tier-stars">★★</span>
        </div>
        <div class="tier-movies" id="tier-A"
             ondragover="movieDragOver(event)"
             ondragleave="movieDragLeave(event)"
             ondrop="movieDrop(event, 'A')">
        </div>
      </div>

      <!-- B 티어 -->
      <div class="tier-row tier-b" data-tier="B"
           draggable="true"
           ondragstart="rowDragStart(event, 'B')"
           ondragover="rowDragOver(event)"
           ondragend="rowDragEnd(event)"
           ondrop="rowDrop(event, 'B')">
        <div class="tier-label">
          <span>B</span>
          <span class="tier-stars">★</span>
        </div>
        <div class="tier-movies" id="tier-B"
             ondragover="movieDragOver(event)"
             ondragleave="movieDragLeave(event)"
             ondrop="movieDrop(event, 'B')">
        </div>
      </div>

    </div>

    <!-- 미배치 영화 영역 -->
    <div class="section-title">🎞 배치되지 않은 영화</div>
    <div class="unplaced-section"
         ondragover="movieDragOver(event)"
         ondragleave="movieDragLeave(event)"
         ondrop="movieDrop(event, 'unplaced')">
      <div class="unplaced-movies" id="tier-unplaced">
        <button class="add-movie-btn" onclick="openAddModal()">＋</button>
      </div>
    </div>

  </div>
</div>

<!-- ===== 영화 추가 모달 ===== -->
<div class="modal-overlay" id="addModal">
  <div class="modal">
    <h3>🎬 영화 추가</h3>
    <label class="modal-label">영화 제목</label>
    <input type="text" id="addTitle" placeholder="예) 인터스텔라" maxlength="30" />
    <label class="modal-label">포스터 이미지 URL</label>
    <input type="text" id="addPoster" placeholder="https://..." />
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeAddModal()">취소</button>
      <button class="btn-confirm" onclick="confirmAddMovie()">추가하기</button>
    </div>
  </div>
</div>

<!-- ===== 공유 모달 ===== -->
<div class="modal-overlay" id="shareModal">
  <div class="modal">
    <h3>🔗 티어리스트 공유</h3>
    <label class="modal-label">아래 링크를 친구에게 보내세요</label>
    <div class="share-link-box">
      <input type="text" id="shareLinkInput" readonly />
      <button class="btn-copy" onclick="copyLink()">복사</button>
    </div>
    <label class="modal-label">친구 이름 (저장용)</label>
    <input type="text" id="friendNameInput" placeholder="예) 김철수" maxlength="10" />
    <div class="modal-btns">
      <button class="btn-cancel" onclick="closeShareModal()">닫기</button>
      <button class="btn-confirm" onclick="saveAndShare()">친구 목록에 저장</button>
    </div>
  </div>
</div>

<!-- ===== 친구 목록 모달 ===== -->
<div class="modal-overlay" id="friendsModal">
  <div class="modal">
    <h3>👥 친구 티어리스트</h3>
    <div class="friends-list" id="friendsList"></div>
    <div class="modal-btns">
      <button class="btn-confirm" onclick="closeFriendsModal()">닫기</button>
    </div>
  </div>
</div>

<!-- ===== 토스트 알림 ===== -->
<div class="toast" id="toast">
  <div class="toast-title" id="toastTitle"></div>
  <div class="toast-msg" id="toastMsg"></div>
</div>

<script>
// ===== 기본 영화 데이터 =====
const DEFAULT_MOVIES = [
  { id: 1, title: '인터스텔라', poster: 'https://image.tmdb.org/t/p/w200/gEU2QniE6E77NI6lCU6MxlNBvIx.jpg' },
  { id: 2, title: '기생충', poster: 'https://image.tmdb.org/t/p/w200/7IiTTgloJzvGI1TAYymCfbfl3vT.jpg' },
  { id: 3, title: '어벤져스', poster: 'https://image.tmdb.org/t/p/w200/RYMX2wcKCBAr24UyPD7429EjYkq.jpg' },
  { id: 4, title: '타이타닉', poster: 'https://image.tmdb.org/t/p/w200/9xjZS2rlVxm8SFx8kPC3aIGCOYQ.jpg' },
  { id: 5, title: '조커', poster: 'https://image.tmdb.org/t/p/w200/udDclJoHjfjb8Ekgsd4FDteOkCU.jpg' },
  { id: 6, title: '듄', poster: 'https://image.tmdb.org/t/p/w200/d5NXSklXo0qyIYkgV94XAgMIckC.jpg' },
  { id: 7, title: '라라랜드', poster: 'https://image.tmdb.org/t/p/w200/uDO8zWDhfWwoFdKS4fzkUJt0Rf0.jpg' },
  { id: 8, title: '매트릭스', poster: 'https://image.tmdb.org/t/p/w200/f89U3ADr1oiB1s9GkdPOEpXUk5H.jpg' },
];

// ===== 앱 상태 =====
let currentUser = '';
let movies = [];       // { id, title, poster, tier }
let tierOrder = ['S', 'A', 'B'];
let dragMovieId = null;
let dragRowTier = null;
let dragOverRowTier = null;
let nextId = 100;

// ===== 시작 =====
function startApp() {
  const name = document.getElementById('nameInput').value.trim();
  if (!name) { showToast('이름 입력', '이름을 입력해주세요!'); return; }

  currentUser = name;
  document.getElementById('userBadge').textContent = name + ' 님';
  document.getElementById('startPage').style.display = 'none';
  document.getElementById('mainPage').style.display = 'block';

  loadData();
  renderAll();
  showToast('환영합니다! 🎬', name + ' 님의 티어리스트를 시작합니다.');
}

// Enter 키로 시작
document.getElementById('nameInput').addEventListener('keydown', function(e) {
  if (e.key === 'Enter') startApp();
});

// ===== 데이터 로드 / 저장 =====
function loadData() {
  const saved = localStorage.getItem('tierMovies_' + currentUser);
  if (saved) {
    movies = JSON.parse(saved);
  } else {
    movies = DEFAULT_MOVIES.map(m => ({ ...m, tier: 'unplaced' }));
  }

  const savedOrder = localStorage.getItem('tierOrder_' + currentUser);
  if (savedOrder) tierOrder = JSON.parse(savedOrder);

  const savedId = localStorage.getItem('nextId_' + currentUser);
  if (savedId) nextId = parseInt(savedId);
}

function saveData() {
  localStorage.setItem('tierMovies_' + currentUser, JSON.stringify(movies));
  localStorage.setItem('tierOrder_' + currentUser, JSON.stringify(tierOrder));
  localStorage.setItem('nextId_' + currentUser, String(nextId));
}

// ===== 렌더링 =====
function renderAll() {
  renderTierRows();
  renderMovies();
}

function renderTierRows() {
  const container = document.getElementById('tierContainer');
  const rows = container.querySelectorAll('.tier-row');

  // tierOrder 순서대로 DOM 정렬
  tierOrder.forEach(tier => {
    const row = [...rows].find(r => r.dataset.tier === tier);
    if (row) container.appendChild(row);
  });
}

function renderMovies() {
  // 각 티어 영역 초기화 (+ 버튼 제외)
  ['S', 'A', 'B'].forEach(tier => {
    document.getElementById('tier-' + tier).innerHTML = '';
  });

  // 미배치 영역 초기화 (+ 버튼 유지)
  const unplacedEl = document.getElementById('tier-unplaced');
  unplacedEl.innerHTML = '';

  // 영화 카드 렌더
  movies.forEach(movie => {
    const card = createMovieCard(movie);
    const targetId = 'tier-' + movie.tier;
    const targetEl = document.getElementById(targetId);
    if (targetEl) targetEl.appendChild(card);
  });

  // + 버튼은 항상 미배치 영역 마지막에
  const addBtn = document.createElement('button');
  addBtn.className = 'add-movie-btn';
  addBtn.textContent = '＋';
  addBtn.onclick = openAddModal;
  unplacedEl.appendChild(addBtn);
}

function createMovieCard(movie) {
  const card = document.createElement('div');
  card.className = 'movie-card';
  card.draggable = true;
  card.dataset.id = movie.id;

  card.innerHTML = `
    <img src="${movie.poster}" alt="${movie.title}"
         onerror="this.src='https://via.placeholder.com/80x110/1a1a2e/666?text=No+Image'" />
    <div class="movie-title">${movie.title}</div>
    <button class="delete-btn" onclick="deleteMovie(${movie.id}, event)">✕</button>
  `;

  card.addEventListener('dragstart', (e) => movieDragStart(e, movie.id));
  card.addEventListener('dragend', movieDragEnd);

  return card;
}

// ===== 영화 드래그 =====
function movieDragStart(e, id) {
  dragMovieId = id;
  dragRowTier = null;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => {
    document.querySelector(`.movie-card[data-id="${id}"]`)?.classList.add('dragging');
  }, 0);
}

function movieDragEnd() {
  dragMovieId = null;
  document.querySelectorAll('.movie-card.dragging').forEach(el => el.classList.remove('dragging'));
  document.querySelectorAll('.drag-over-movies').forEach(el => el.classList.remove('drag-over-movies'));
}

function movieDragOver(e) {
  e.preventDefault();
  e.dataTransfer.dropEffect = 'move';
  // 행 드래그 중이면 무시
  if (dragRowTier) return;
  e.currentTarget.classList.add('drag-over-movies');
}

function movieDragLeave(e) {
  e.currentTarget.classList.remove('drag-over-movies');
}

function movieDrop(e, tier) {
  e.preventDefault();
  e.stopPropagation();
  e.currentTarget.classList.remove('drag-over-movies');

  if (dragMovieId === null) return;

  const movie = movies.find(m => m.id === dragMovieId);
  if (!movie) return;

  movie.tier = tier;
  saveData();
  renderMovies();
  showToast('배치 완료! ✅', `"${movie.title}"을(를) ${tier === 'unplaced' ? '미배치' : tier + ' 티어'}로 이동했어요.`);
}

// ===== 행(Row) 드래그 =====
function rowDragStart(e, tier) {
  // 영화 카드 위에서 시작한 경우 행 드래그 막기
  if (dragMovieId !== null) { e.preventDefault(); return; }
  dragRowTier = tier;
  dragMovieId = null;
  e.dataTransfer.effectAllowed = 'move';
  setTimeout(() => {
    document.querySelector(`.tier-row[data-tier="${tier}"]`)?.classList.add('row-dragging');
  }, 0);
}

function rowDragOver(e) {
  if (!dragRowTier) return;
  e.preventDefault();
  e.stopPropagation();
  const row = e.currentTarget;
  row.classList.add('drag-over-row');
  dragOverRowTier = row.dataset.tier;
}

function rowDragEnd(e) {
  document.querySelectorAll('.tier-row.row-dragging').forEach(el => el.classList.remove('row-dragging'));
  document.querySelectorAll('.tier-row.drag-over-row').forEach(el => el.classList.remove('drag-over-row'));
  dragRowTier = null;
  dragOverRowTier = null;
}

function rowDrop(e, targetTier) {
  if (!dragRowTier || dragRowTier === targetTier) return;
  e.preventDefault();
  e.stopPropagation();

  const fromIdx = tierOrder.indexOf(dragRowTier);
  const toIdx = tierOrder.indexOf(targetTier);
  if (fromIdx === -1 || toIdx === -1) return;

  // 순서 교체
  tierOrder.splice(fromIdx, 1);
  tierOrder.splice(toIdx, 0, dragRowTier);

  saveData();
  renderTierRows();

  document.querySelectorAll('.tier-row.drag-over-row').forEach(el => el.classList.remove('drag-over-row'));
  document.querySelectorAll('.tier-row.row-dragging').forEach(el => el.classList.remove('row-dragging'));
  dragRowTier = null;

  showToast('순서 변경 ✅', '티어 행 순서를 바꿨어요!');
}

function saveAndShare() {
